name: CI

on:
  push:
    branches: [main, ubiquity]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Node.js 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          version: 9.12.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run test
        run: pnpm test

      - name: Build
        # Vercel builds every push and PR. Keep this as a manual diagnostic so
        # CI does not duplicate the rate-limited Notion crawl.
        if: github.event_name == 'workflow_dispatch'
        run: pnpm build
