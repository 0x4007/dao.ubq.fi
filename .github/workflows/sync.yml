name: 'Upstream Sync'

on:
  schedule:
    - cron: '0 0 * * *' # scheduled at 00:00 every day

  workflow_dispatch:
    inputs:
      sync_test_mode:
        description: 'Run without pushing changes'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          ref: ubiquity
          persist-credentials: false

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: ubiquity
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: transitive-bullshit/nextjs-notion-starter-kit
          test_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_test_mode || false }}

      - name: Report sync result
        run: |
          echo "Upstream changes found: ${{ steps.sync.outputs.has_new_commits }}"
